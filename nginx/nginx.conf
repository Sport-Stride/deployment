# Production Nginx Configuration for Coachify Platform
# Supports both app.coachify.tn (main app) and coachify.tn (vitrine)

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 100M;

    # Proxy buffer settings for large headers (NextAuth sessions)
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 24k;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript;

    # Docker DNS - CRITICAL
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=proxy:10m rate=100r/s;

    server_tokens off;

    # ===========================================
    # Upstreams
    # ===========================================

    # Main Application Frontend
    upstream frontend_upstream {
        least_conn;
        server frontend:3000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Landing Page Frontend
    upstream landing_upstream {
        least_conn;
        server landing:3001 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Backend APIs
    upstream account_upstream {
        least_conn;
        server account-api:8082 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream chat_upstream {
        least_conn;
        server chat-api:8083 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream workout_upstream {
        least_conn;
        server workout-api:8087 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream tracker_upstream {
        least_conn;
        server tracker-api:8088 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream statistics_upstream {
        least_conn;
        server statistics-api:8089 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream payments_upstream {
        least_conn;
        server payments-api:8086 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream notification_upstream {
        least_conn;
        server notification-api:8081 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ===========================================
    # HTTP to HTTPS Redirect - Main App
    # ===========================================
    server {
        listen 80;
        listen [::]:80;
        server_name app.coachify.tn;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ===========================================
    # HTTP to HTTPS Redirect - Vitrine
    # ===========================================
    server {
        listen 80;
        listen [::]:80;
        server_name coachify.tn www.coachify.tn;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ===========================================
    # HTTP to HTTPS Redirect - API
    # ===========================================
    server {
        listen 80;
        listen [::]:80;
        server_name api.coachify.tn;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ===========================================
    # HTTPS Server - Main Application (app.coachify.tn)
    # ===========================================
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name app.coachify.tn;

        # SSL Configuration
        ssl_certificate /etc/letsencrypt/live/app.coachify.tn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app.coachify.tn/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/app.coachify.tn/chain.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Next.js static assets
        location /_next/static/ {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        location /_next/image {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /_next/data/ {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Auth routes - CRITICAL - Must be first
        location /api/auth/ {
            limit_req zone=auth burst=20 nodelay;

            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;

            # Large buffers for NextAuth JWT sessions
            proxy_buffer_size 32k;
            proxy_buffers 8 32k;
            proxy_busy_buffers_size 224k;

            proxy_buffering on;
            proxy_request_buffering off;
            proxy_redirect off;

            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Next.js proxy routes - Must be second
        location /api/proxy/ {
            limit_req zone=proxy burst=100 nodelay;

            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;

            proxy_buffering off;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 10s;
            proxy_send_timeout 90s;
            proxy_read_timeout 90s;
        }

        # ALL other /api/* routes go to Next.js frontend
        location /api/ {
            limit_req zone=api burst=50 nodelay;

            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;

            # Support WebSocket upgrades for chat
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_cache_bypass $http_upgrade;

            proxy_connect_timeout 10s;
            proxy_send_timeout 90s;
            proxy_read_timeout 90s;
        }

        # Frontend catch-all
        location / {
            limit_req zone=general burst=30 nodelay;

            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;
            proxy_redirect off;

            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # Deny sensitive paths
        location ~ /\. {
            deny all;
            access_log off;
        }

        # Health check
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }

    # ===========================================
    # HTTPS Server - API Subdomain (api.coachify.tn)
    # ===========================================
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name api.coachify.tn;

        # SSL Configuration
        ssl_certificate /etc/letsencrypt/live/api.coachify.tn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.coachify.tn/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/api.coachify.tn/chain.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Common proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # -------------------------------------------
        # Payments
        # -------------------------------------------

        # Webhook - exact-match - server-to-server POST only
        location = /payments/webhooks/flouci {
            proxy_pass http://payments_upstream/payments/webhooks/flouci;
            proxy_http_version 1.1;
            proxy_buffering off;
            client_max_body_size 10M;
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 60s;
        }

        location /payments/ {
            limit_req zone=api burst=30 nodelay;

            proxy_pass http://payments_upstream/;
            proxy_http_version 1.1;
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 60s;
        }

        # -------------------------------------------
        # Workout
        # -------------------------------------------
        location /workout/ {
            limit_req zone=api burst=50 nodelay;

            proxy_pass http://workout_upstream/;
            proxy_http_version 1.1;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # -------------------------------------------
        # Notifications
        # Push token registration, notification prefs,
        # and read/dismiss actions called from the frontend.
        # Internal service-to-service calls bypass nginx entirely
        # via Docker network (http://notification-api:8081).
        # -------------------------------------------
        location /notifications/ {
            limit_req zone=api burst=50 nodelay;

            proxy_pass http://notification_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 8 8k;
        }

        # Health check
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # Deny everything else
        location / {
            return 404;
        }
    }

    # ===========================================
    # HTTPS Server - Vitrine/Landing Page (coachify.tn)
    # ===========================================
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name coachify.tn www.coachify.tn;

        # SSL Configuration
        ssl_certificate /etc/letsencrypt/live/coachify.tn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/coachify.tn/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/coachify.tn/chain.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Redirect www to non-www
        if ($host = 'www.coachify.tn') {
            return 301 https://coachify.tn$request_uri;
        }

        # Next.js/Vite static assets
        location /_next/static/ {
            proxy_pass http://landing_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        location /_next/image {
            proxy_pass http://landing_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Static assets (for Vite/React apps)
        location /assets/ {
            proxy_pass http://landing_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # API routes for landing (if any)
        location /api/payment/ {
            limit_req zone=api burst=30 nodelay;

            proxy_pass http://payments_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        location /api/ {
            limit_req zone=api burst=30 nodelay;

            proxy_pass http://landing_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Main landing routes
        location / {
            limit_req zone=general burst=30 nodelay;

            proxy_pass http://landing_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;

            proxy_redirect off;

            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # Deny sensitive paths
        location ~ /\. {
            deny all;
            access_log off;
        }

        # Health check
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
}