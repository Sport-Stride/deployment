  # ===========================================
  # Frontend Application
  # ===========================================

  frontend:
    image: ghcr.io/sport-stride/coachify-frontend:${FRONTEND_VERSION:-latest}
    container_name: coachify-frontend
    restart: unless-stopped
    env_file:
      - .env.production
    networks:
      coachify_net:
        ipv4_address: 172.28.0.20
    pull_policy: always
    depends_on:
      - identifier-api
      - notification-api
      - account-api
      - chat-api
      - content-api
      - invitation-api
      - payments-api
      - workout-api
      - tracker-api
      - statistics-api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
        labels: "service=frontend,env=production"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
