    environment:
      - PORT=8083
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - ACCOUNT_API_URL=http://account-api:8082
    networks:
      coachify_net:
        ipv4_address: 172.28.0.13
    pull_policy: always
    depends_on:
      account-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
        labels: "service=chat-api,env=production"
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  content-api:
    image: ghcr.io/sport-stride/coachify-content-api:${CONTENT_API_VERSION:-latest}
    container_name: coachify-content-api
    restart: unless-stopped
    env_file:
