  tracker-api:
    image: ghcr.io/sport-stride/coachify-tracker-api:${TRACKER_API_VERSION:-latest}
    container_name: coachify-tracker-api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - PORT=8088
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - IDENTIFIER_API_URL=http://identifier-api:8080
      - WORKOUT_MANAGEMENT_URL=http://workout-api:8087
      - ACCOUNT_API_URL=http://account-api:8082
    labels:
      - logging=promtail
      - env=production
      - platform=coachify
    networks:
      - coachify_net
    pull_policy: always
    depends_on:
      - identifier-api
      - workout-api
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=tracker-api,env=production"
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  statistics-api:
    image: ghcr.io/sport-stride/coachify-statistics-api:${STATISTICS_API_VERSION:-latest}
    container_name: coachify-statistics-api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - PORT=8089
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - IDENTIFIER_API_URL=http://identifier-api:8080
      - WORKOUT_MANAGEMENT_URL=http://workout-api:8087
    labels:
      - logging=promtail
      - env=production
      - platform=coachify
    networks:
      - coachify_net
    pull_policy: always
    depends_on:
      - identifier-api
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=statistics-api,env=production"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M