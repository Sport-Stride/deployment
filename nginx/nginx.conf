    #     # OCSP stapling
    #     ssl_stapling on;
    #     ssl_stapling_verify on;
    #
    #     # HSTS (enable after confirming HTTPS works)
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    #
    #     # Security headers for HTTPS
    #     add_header X-Frame-Options "SAMEORIGIN" always;
    #     add_header X-Content-Type-Options "nosniff" always;
    #     add_header X-XSS-Protection "1; mode=block" always;
    #     add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    #     add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    #     add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https:;" always;
    #
    #     # Logs
    #     access_log /var/log/nginx/https_access.log main buffer=32k flush=1s;
    #     error_log /var/log/nginx/https_error.log warn;
