    networks:
      coachify_net:
        ipv4_address: 172.28.0.16
    pull_policy: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 30s
      timeout: 5s
      retries: 3
