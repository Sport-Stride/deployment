# /nginx/nginx.conf
# Production-grade Nginx reverse proxy configuration for Coachify Platform
# Serves as single entry point with load balancing, SSL/TLS, and security headers

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

        # ==========================================
        # Logging Configuration
        # ==========================================
        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                                        '$status $body_bytes_sent "$http_referer" '
                                        '"$http_user_agent" "$http_x_forwarded_for" '
                                        'rt=$request_time uct="$upstream_connect_time" '
                                        'uht="$upstream_header_time" urt="$upstream_response_time"';

        # JSON logging for monitoring integration
        log_format json_combined escape=json
            '{'
                '"time_local":"$time_local",'
                '"remote_addr":"$remote_addr",'
                '"remote_user":"$remote_user",'
                '"request":"$request",'
                '"status": "$status",'
                '"body_bytes_sent":"$body_bytes_sent",'
                '"request_time":"$request_time",'
                '"http_referrer":"$http_referer",'
                '"http_user_agent":"$http_user_agent"'
            '}';

        access_log /var/log/nginx/access.log main buffer=32k flush=1s;
        error_log /var/log/nginx/error.log warn;
        access_log /var/log/nginx/json_access.log json_combined buffer=32k flush=1s;

    # ==========================================
    # Performance Optimization
    # ==========================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";

    # ==========================================
    # Security Headers & Rate Limiting
    # ==========================================
    # Global rate limiting: 10 requests per second per IP
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=3r/s;

    # Connection limits
    limit_conn_zone $binary_remote_addr zone=addr:10m;
    limit_conn addr 100;

    # ==========================================
    # Security - Prevent Common Attacks
    # ==========================================
    # Disable directory listing
    autoindex off;

    # Hide nginx version
    server_tokens off;

    # Prevent clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # XSS Protection
    add_header X-XSS-Protection "1; mode=block" always;

    # Referrer Policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions Policy (formerly Feature Policy)
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Content Security Policy (adjust as needed for your app)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

    # ==========================================
    # Upstream Service Definitions
    # ==========================================
    upstream frontend {
        least_conn;
        server frontend:3000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream identifier_api {
        least_conn;
        server identifier-api:8080 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream notification_api {
        least_conn;
        server notification-api:8081 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream account_api {
        least_conn;
        server account-api:8082 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream chat_api {
        least_conn;
        server chat-api:8083 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream content_api {
        least_conn;
        server content-api:8084 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream invitation_api {
        least_conn;
        server invitation-api:8085 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream payments_api {
        least_conn;
        server payments-api:8086 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream workout_api {
        least_conn;
        server workout-api:8087 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream tracker_api {
        least_conn;
        server tracker-api:8088 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream statistics_api {
        least_conn;
        server statistics-api:8089 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ==========================================
    # Health Check Endpoint (for reverse proxy)
    # ==========================================
    server {
        listen 8080;
        listen [::]:8080;
        server_name _;

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location /metrics {
            access_log off;
            return 404;
        }
    }

    # ==========================================
    # HTTP Server (Local/Development)
    # ==========================================
    # This server serves HTTP for local development and Docker internal communication.
    # For production with valid SSL certs, use the HTTPS server block below instead.
    # ==========================================
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Security headers for HTTP (applied uniformly)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Allow Let's Encrypt validation
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # ==========================================
        # Frontend Application (HTTP)
        # ==========================================
        location / {
            limit_req zone=general burst=30 nodelay;
            
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_set_header X-Forwarded-Host $server_name;

            # Timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # Buffering for better performance
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;

            # Error handling
            proxy_intercept_errors on;
            error_page 502 503 504 /50x.html;
        }

        # ==========================================
        # API Routes (HTTP) - Account/OAuth
        # ==========================================
        location /api/auth/ {
            limit_req zone=auth burst=10 nodelay;
            
            proxy_pass http://account_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;

            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        location /api/account/ {
            limit_req zone=api burst=50 nodelay;
            
            proxy_pass http://account_api/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;

            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Chat API (supports WebSocket)
        location /api/chat/ {
            limit_req zone=api burst=50 nodelay;
            
            proxy_pass http://chat_api/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;

            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Content API
        location /api/content/ {
            limit_req zone=api burst=50 nodelay;
            
            proxy_pass http://content_api/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;

            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Invitation API
        location /api/invitation/ {
            limit_req zone=api burst=50 nodelay;
            
            proxy_pass http://invitation_api/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;

            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Payments API
        location /api/payments/ {
            limit_req zone=api burst=20 nodelay;
            
            proxy_pass http://payments_api/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;

            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Workout API
        location /api/workout/ {
            limit_req zone=api burst=50 nodelay;
            
            proxy_pass http://workout_api/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;

            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Tracker API
        location /api/tracker/ {
            limit_req zone=api burst=50 nodelay;
            
            proxy_pass http://tracker_api/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;

            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Statistics API
        location /api/statistics/ {
            limit_req zone=api burst=30 nodelay;
            
            proxy_pass http://statistics_api/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;

            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Identifier API
        location /api/identifier/ {
            limit_req zone=api burst=100 nodelay;
            
            proxy_pass http://identifier_api/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;

            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Notification API
        location /api/notification/ {
            limit_req zone=api burst=100 nodelay;
            
            proxy_pass http://notification_api/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ==========================================
        # Deny Access to Sensitive Paths
        # ==========================================
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ /\.env {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ==========================================
        # Static Assets Caching
        # ==========================================
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ==========================================
        # Error Pages
        # ==========================================
        error_page 502 503 504 @maintenance;
        location @maintenance {
            default_type text/html;
            return 503 '<html><body><h1>Service Temporarily Unavailable</h1><p>The service is temporarily unavailable. Please try again later.</p></body></html>';
        }

        # ==========================================
        # Health Check (Internal)
        # ==========================================
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }

    # ==========================================
    # PRODUCTION: HTTPS Server (Let's Encrypt Template)
    # ==========================================
    # IMPORTANT: Uncomment this block and provide correct domain and certificate
    # paths to enable HTTPS in production. Mount /etc/letsencrypt to the nginx
    # container or provide certs at the specified paths.
    #
    # server {
    #     listen 443 ssl http2 default_server;
    #     listen [::]:443 ssl http2 default_server;
    #     server_name yourdomain.com www.yourdomain.com;
    #
    #     # SSL/TLS Configuration (modern recommended settings)
    #     ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    #     ssl_trusted_certificate /etc/letsencrypt/live/yourdomain.com/chain.pem;
    #
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    #     ssl_prefer_server_ciphers off;
    #
    #     # SSL session optimization
    #     ssl_session_cache shared:SSL:50m;
    #     ssl_session_timeout 1d;
    #     ssl_session_tickets off;
