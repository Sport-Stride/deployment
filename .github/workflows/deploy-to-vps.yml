name: Deploy to VPS

on:
  repository_dispatch:
    types: [service-built]
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy (e.g., account-api) or "all"'
        required: false
        default: 'all'

# Ensure only one deploy runs at a time; queue instead of cancel
concurrency:
  group: deploy-to-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.DISPATCH_TOKEN }} 

      - name: Extract service name
        id: service
        run: |
          # For repository_dispatch, get from payload
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            SERVICE="${{ github.event.client_payload.service }}"
            VERSION="${{ github.event.client_payload.version }}"
          else
            # For workflow_dispatch, get from input
            SERVICE="${{ github.event.inputs.service || 'all' }}"
            VERSION="manual"
          fi
          
          echo "service=$SERVICE" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          echo "📦 Deploying service: $SERVICE"
          echo "🏷️  Version: $VERSION"

      - name: Update version file
        if: github.event_name == 'repository_dispatch'
        run: |
          SERVICE="${{ steps.service.outputs.service }}"
          VERSION="${{ steps.service.outputs.version }}"
          
          if [ -z "$SERVICE" ] || [ "$SERVICE" = "all" ]; then
            echo "⚠️ No specific service, skipping version update"
            exit 0
          fi
          
          # Convert service name to env var format (e.g., account-api -> ACCOUNT_API_VERSION)
          ENV_VAR=$(echo "${SERVICE}" | tr '[:lower:]' '[:upper:]' | tr '-' '_')_VERSION
          
          echo "Updating ${ENV_VAR}=${VERSION}"
          
          # Update versions.env
          if grep -q "^${ENV_VAR}=" versions.env 2>/dev/null; then
            sed -i "s|^${ENV_VAR}=.*|${ENV_VAR}=${VERSION}|" versions.env
          else
            echo "${ENV_VAR}=${VERSION}" >> versions.env
          fi
          
          echo "📄 Current versions.env:"
          cat versions.env
          
          # Commit changes
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add versions.env
          
          if git diff --staged --quiet; then
            echo "ℹ️  No changes to commit"
          else
            git commit -m "deploy: update ${SERVICE} to ${VERSION}"
            
            # Push with retry logic
            MAX_RETRIES=3
            RETRY_COUNT=0
            
            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              if git push; then
                echo "✅ Version file updated and pushed successfully"
                break
              else
                RETRY_COUNT=$((RETRY_COUNT + 1))
                if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                  echo "⚠️  Push failed, retrying ($RETRY_COUNT/$MAX_RETRIES)..."
                  sleep 2
                  git pull --rebase
                else
                  echo "❌ Failed to push after $MAX_RETRIES attempts"
                  exit 1
                fi
              fi
            done
          fi

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          SERVICE_NAME: ${{ steps.service.outputs.service }}
          SERVICE_VERSION: ${{ steps.service.outputs.version }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: SERVICE_NAME,SERVICE_VERSION
          script: |
            set -e
            
            echo "=========================================="
            echo "🚀 Starting deployment"
            echo "Service: $SERVICE_NAME"
            echo "Version: $SERVICE_VERSION"
            echo "=========================================="
            
            cd /home/deploy/production/coachify
            
            # Run deployment script with service name
            bash scripts/deploy.sh "$SERVICE_NAME"
            
            echo ""
            echo "=========================================="
            echo "✅ Deployment completed successfully"
            echo "=========================================="

      - name: Verify deployment
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ✅ Success" >> $GITHUB_STEP_SUMMARY
          echo "- **Service:** \`${{ steps.service.outputs.service }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** \`${{ steps.service.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **VPS:** \`${{ secrets.VPS_HOST }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The service is now running the updated version on production." >> $GITHUB_STEP_SUMMARY

      - name: Rollback on failure
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            DEPLOYMENT_DIR="/home/deploy/production/coachify"
            LOG_FILE="${DEPLOYMENT_DIR}/deploy.log"
            
            echo "[$(date +'%Y-%m-%d %H:%M:%S')] ⚠️ Deployment failed, attempting recovery..." | tee -a "$LOG_FILE"
            
            cd "$DEPLOYMENT_DIR"
            
            # Restart all services to ensure stability
            docker compose -f docker-compose.prod.yml restart
            
            echo "[$(date +'%Y-%m-%d %H:%M:%S')] ℹ️  Services restarted" | tee -a "$LOG_FILE"
