# Prometheus Configuration for Coachify Platform
# Collects metrics from all microservices

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'coachify-platform'
    environment: 'production'

# AlertManager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load alert rules
rule_files:
  - '/etc/prometheus/alerts.yml'

# Scrape configuration
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Go API Services with built-in metrics
  # Note: Services should expose /metrics endpoint for Prometheus scraping
  # Add prometheus client to each Go service's go.mod:
  # github.com/prometheus/client_golang v1.17.0

  - job_name: 'identifier-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['identifier-api:8080']
        labels:
          service: 'identifier'
          tier: 'core'
    scrape_interval: 10s
    scrape_timeout: 5s

  - job_name: 'notification-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['notification-api:8081']
        labels:
          service: 'notification'
          tier: 'messaging'
    scrape_interval: 10s

  - job_name: 'account-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['account-api:8082']
        labels:
          service: 'account'
          tier: 'core'
    scrape_interval: 10s

  - job_name: 'chat-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['chat-api:8083']
        labels:
          service: 'chat'
          tier: 'messaging'
    scrape_interval: 10s

  - job_name: 'content-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['content-api:8084']
        labels:
          service: 'content'
          tier: 'data'
    scrape_interval: 10s

  - job_name: 'invitation-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['invitation-api:8085']
        labels:
          service: 'invitation'
          tier: 'core'
    scrape_interval: 10s

  - job_name: 'payments-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['payments-api:8086']
        labels:
          service: 'payments'
          tier: 'critical'
    scrape_interval: 10s

  - job_name: 'workout-api'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['workout-api:8087']
        labels:
          service: 'workout'
          tier: 'data'
    scrape_interval: 10s

  - job_name: 'tracker-api'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['tracker-api:8088']
        labels:
          service: 'tracker'
          tier: 'data'
    scrape_interval: 10s

  - job_name: 'statistics-api'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['statistics-api:8089']
        labels:
          service: 'statistics'
          tier: 'analytics'
    scrape_interval: 10s

  # # Docker daemon metrics (requires docker socket volume)
  # - job_name: 'docker'
  #   static_configs:
  #     - targets: ['unix:///var/run/docker.sock']
  #   relabel_configs:
  #     - source_labels: [__scheme__]
  #       target_label: __scheme__
  #       replacement: unix

  # Nginx reverse proxy metrics (if using prometheus-nginx-module)
  # Uncomment once nginx is configured with prometheus module
  # - job_name: 'nginx'
  #   static_configs:
  #     - targets: ['nginx-proxy:8888']  # Requires stub_status module

  # ===========================================
  # MongoDB Exporter — per-operation latency, collection stats, connection pool
  # Source: percona/mongodb_exporter running in coachify-mongodb-exporter container
  # Key metrics:
  #   mongodb_mongod_op_latencies_latency_total  → cumulative latency by op type
  #   mongodb_mongod_op_latencies_ops_total      → op count by type (reads/writes/commands)
  #   mongodb_mongod_connections                 → connection pool (current/available)
  #   mongodb_mongod_wiredtiger_cache_bytes      → cache hit/miss ratio
  #   mongodb_mongod_metrics_document_total      → docs inserted/returned/updated/deleted
  #   mongodb_mongod_top_*                       → per-collection time/count (requires topmetrics)
  #   mongodb_collstats_*                        → per-collection latency histograms
  # ===========================================
  - job_name: 'mongodb'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['mongodb-exporter:9216']
        labels:
          service: 'mongodb'
          tier: 'database'
    scrape_interval: 10s
    scrape_timeout: 8s

  # ===========================================
  # Frontend (Next.js) — browser HTTP request latency
  # Histograms emitted by axiosSingletons.ts via sendBeacon → /api/metrics/frontend
  # Scraped from the frontend container running on port 3000.
  # Key metrics:
  #   frontend_http_request_duration_ms_bucket  → per-service latency histogram (ms)
  #   frontend_http_request_duration_ms_sum     → total time per service/method/status
  #   frontend_http_request_duration_ms_count   → request count
  # Labels: service, method, status_code
  # ===========================================
  - job_name: 'frontend'
    metrics_path: '/api/metrics/frontend'
    static_configs:
      - targets: ['frontend:3000']
        labels:
          service: 'frontend'
          tier: 'client'
    scrape_interval: 15s
    scrape_timeout: 10s

remote_write: []
# Optional: Send metrics to external storage (InfluxDB, VictoriaMetrics, etc.)
# - url: "http://remote-storage:9009/api/v1/push"
#   queue_config:
#     capacity: 10000
