version: '3.9'

# Production Docker Compose - Uses pre-built images from GHCR
# NO local builds; only pulls from registry
# Deploy: docker compose -f docker-compose.prod.yml --env-file .env.production up -d

networks:
  coachify_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
    driver_opts:
      "com.docker.network.driver.mtu": "1500"

volumes:
  nginx_logs:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  alertmanager_data:
    driver: local

services:
  # ===========================================
  # Reverse Proxy & Load Balancer
  # ===========================================
  nginx-proxy:
    image: nginx:1.25-alpine
    container_name: coachify-nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl
      - ./nginx/docker-entrypoint.d:/docker-entrypoint.d:ro
      - nginx_logs:/var/log/nginx
    environment:
      - TZ=UTC
    networks:
      coachify_net:
        ipv4_address: 172.28.0.2
    depends_on:
      - frontend
      - identifier-api
      - notification-api
      - account-api
      - chat-api
      - content-api
      - invitation-api
      - payments-api
      - workout-api
      - tracker-api
      - statistics-api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=nginx-proxy,env=production"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ===========================================
  # Core Microservices - Go APIs (Registry Images)
  # ===========================================

  identifier-api:
    image: ghcr.io/sport-stride/coachify-identifier-api:${IDENTIFIER_API_VERSION:-latest}
    container_name: coachify-identifier-api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - PORT=8080
      - MONGODB_URI=${MONGODB_URI}
      - ENVIRONMENT=production
      - LOG_LEVEL=info
    networks:
      coachify_net:
        ipv4_address: 172.28.0.10
    pull_policy: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
        labels: "service=identifier-api,env=production"
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    sysctls:
      - net.ipv4.ip_local_port_range=10000 65535

  notification-api:
    image: ghcr.io/sport-stride/coachify-notification-api:${NOTIFICATION_API_VERSION:-latest}
    container_name: coachify-notification-api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - PORT=8081
      - ENVIRONMENT=production
      - LOG_LEVEL=info
    networks:
      coachify_net:
        ipv4_address: 172.28.0.11
    pull_policy: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
        labels: "service=notification-api,env=production"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 192M
        reservations:
          cpus: '0.25'
          memory: 96M

  account-api:
    image: ghcr.io/sport-stride/coachify-account-api:${ACCOUNT_API_VERSION:-latest}
    container_name: coachify-account-api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - PORT=8082
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - IDENTIFIER_API_URL=http://identifier-api:8080
      - NOTIFICATION_API_URL=http://notification-api:8081
      - INVITATION_API_URL=http://invitation-api:8085
      - PAYMENT_API_URL=http://payments-api:8086
    networks:
      coachify_net:
        ipv4_address: 172.28.0.12
    pull_policy: always
    depends_on:
      identifier-api:
        condition: service_healthy
      notification-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
        labels: "service=account-api,env=production"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  chat-api:
    image: ghcr.io/sport-stride/coachify-chat-api:${CHAT_API_VERSION:-latest}
    container_name: coachify-chat-api
    restart: unless-stopped
    env_file:
