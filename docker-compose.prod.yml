      - IDENTIFIER_API_URL=http://identifier-api:8080
      - NOTIFICATION_API_URL=http://notification-api:8081
      - ACCOUNT_API_URL=http://account-api:8082
    networks:
      coachify_net:
        ipv4_address: 172.28.0.14
    pull_policy: always
    depends_on:
      identifier-api:
        condition: service_healthy
      notification-api:
        condition: service_healthy
      account-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
        labels: "service=content-api,env=production"
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  invitation-api:
    image: ghcr.io/sport-stride/coachify-invitation-api:${INVITATION_API_VERSION:-latest}
    container_name: coachify-invitation-api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - PORT=8085
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - IDENTIFIER_API_URL=http://identifier-api:8080
      - NOTIFICATION_API_URL=http://notification-api:8081
      - ACCOUNT_API_URL=http://account-api:8082
      - CHAT_API_URL=http://chat-api:8083
    networks:
      coachify_net:
        ipv4_address: 172.28.0.15
    pull_policy: always
    depends_on:
      identifier-api:
        condition: service_healthy
      notification-api:
        condition: service_healthy
      account-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
        labels: "service=invitation-api,env=production"
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  payments-api:
    image: ghcr.io/sport-stride/coachify-payments-api:${PAYMENTS_API_VERSION:-latest}
    container_name: coachify-payments-api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
