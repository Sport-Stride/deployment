# AlertManager configuration for Coachify Platform
# Routes alerts to various channels (email, Slack, PagerDuty, etc.)

global:
  resolve_timeout: 5m
  # Gmail SMTP relay (app password — no 2FA prompt)
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_require_tls: true
  smtp_auth_username: 'sportstride727@gmail.com'
  smtp_auth_password: 'jdbelbqcsdvfvixv'
  smtp_from: 'sportstride727@gmail.com'

# Default receiver if no routes match
receivers:
  - name: 'default'
    email_configs:
      - to: 'sportstride727@gmail.com'
        send_resolved: true
        headers:
          Subject: '[COACHIFY] {{ .GroupLabels.alertname }}'

  - name: 'critical'
    email_configs:
      - to: 'sportstride727@gmail.com'
        send_resolved: true
        headers:
          Subject: '[COACHIFY CRITICAL] {{ .GroupLabels.alertname }} — {{ .GroupLabels.service }}'
        html: |
          <h2 style="color:#cc0000;">&#x26A0; {{ .GroupLabels.alertname }}</h2>
          <table style="border-collapse:collapse;font-family:sans-serif;font-size:14px;">
            <tr><td style="padding:4px 12px 4px 0;"><strong>Service</strong></td><td>{{ .GroupLabels.service }}</td></tr>
            <tr><td style="padding:4px 12px 4px 0;"><strong>Severity</strong></td><td>{{ .CommonLabels.severity }}</td></tr>
            <tr><td style="padding:4px 12px 4px 0;"><strong>Description</strong></td><td>{{ .CommonAnnotations.description }}</td></tr>
            <tr><td style="padding:4px 12px 4px 0;"><strong>Fired at</strong></td><td>{{ (index .Alerts 0).StartsAt.Format "2006-01-02 15:04:05 UTC" }}</td></tr>
          </table>
          <br/>
          <a href="http://localhost:3001/explore?datasource=loki-ds&query={service%3D%22{{ (index .Alerts 0).Labels.service }}%22}"
             style="background:#f46800;color:#fff;padding:8px 16px;text-decoration:none;border-radius:4px;">
            &#x1F50D; Explore Logs in Grafana
          </a>
    # Slack webhook for critical alerts (optional)
    # slack_configs:
    #   - api_url: '${SLACK_WEBHOOK_URL}'
    #     channel: '#critical-alerts'
    #     title: 'Critical Alert'
    #     text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'

  - name: 'warning'
    email_configs:
      - to: 'sportstride727@gmail.com'
        send_resolved: true
        headers:
          Subject: '[COACHIFY WARNING] {{ .GroupLabels.alertname }} — {{ .GroupLabels.service }}'

route:
  receiver: 'default'
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h

  # Route critical alerts to critical receiver
  routes:
    - match:
        severity: critical
      receiver: 'critical'
      group_wait: 0s
      repeat_interval: 1h

    - match:
        severity: warning
      receiver: 'warning'
      group_wait: 30s
      repeat_interval: 4h

# Inhibit rules: prevent firing of less severe alerts if more severe ones are already firing
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service']

  - source_match:
      severity: 'critical'
    target_match:
      severity: 'info'
    equal: ['alertname', 'service']
