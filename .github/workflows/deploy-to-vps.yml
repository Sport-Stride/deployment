name: Deploy to VPS

on:
  repository_dispatch:
    types: [service-built]
  workflow_dispatch:
    inputs:
      services:
        description: 'Services to update (comma-separated, or "all")'
        required: false
        default: 'all'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update version file
        if: github.event_name == 'repository_dispatch'
        run: |
          SERVICE="${{ github.event.client_payload.service }}"
          VERSION="${{ github.event.client_payload.version }}"
          
          if [ -z "$SERVICE" ]; then
            echo "⚠️ No service specified, skipping version update"
            exit 0
          fi
          
          # Convert service name to env var format (e.g., account-api -> ACCOUNT_API)
          ENV_VAR=$(echo "${SERVICE}" | tr '[:lower:]' '[:upper:]' | tr '-' '_')_VERSION
          
          # Update versions.env
          if grep -q "^${ENV_VAR}=" versions.env; then
            sed -i "s|^${ENV_VAR}=.*|${ENV_VAR}=${VERSION}|" versions.env
          else
            echo "${ENV_VAR}=${VERSION}" >> versions.env
          fi
          
          cat versions.env
          
          # Commit changes
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add versions.env
          git commit -m "chore: update ${SERVICE} to ${VERSION}" || echo "No changes to commit"
          git push || echo "Push failed or no changes"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            
            DEPLOYMENT_DIR="/home/deploy/production/coachify"
            LOG_FILE="${DEPLOYMENT_DIR}/deploy.log"
            
            echo "[$(date +'%Y-%m-%d %H:%M:%S')] 🚀 Starting deployment..." | tee -a "$LOG_FILE"
            
            cd "$DEPLOYMENT_DIR"
            
            # Backup current state
            BACKUP_NAME="backup-$(date +%s)"
            mkdir -p backups
            docker compose ps > "backups/${BACKUP_NAME}.ps" 2>&1 || true
            
            # Load versions
            set -a
            [ -f versions.env ] && source versions.env
            set +a
            
            # Pull latest images
            echo "[$(date +'%Y-%m-%d %H:%M:%S')] 📦 Pulling latest images..." | tee -a "$LOG_FILE"
            docker compose -f docker-compose.prod.yml pull --quiet
            
            # Validate compose file
            echo "[$(date +'%Y-%m-%d %H:%M:%S')] ✓ Validating docker-compose file..." | tee -a "$LOG_FILE"
            docker compose -f docker-compose.prod.yml config > /dev/null
            
            # Start/update services
            echo "[$(date +'%Y-%m-%d %H:%M:%S')] 🔄 Restarting services..." | tee -a "$LOG_FILE"
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            
            # Wait for services
            echo "[$(date +'%Y-%m-%d %H:%M:%S')] ⏳ Waiting for services to stabilize..." | tee -a "$LOG_FILE"
            sleep 10
            
            docker compose -f docker-compose.prod.yml ps | tee -a "$LOG_FILE"
            
            # Health checks
            echo "[$(date +'%Y-%m-%d %H:%M:%S')] 🏥 Running health checks..." | tee -a "$LOG_FILE"
            
            if docker compose -f docker-compose.prod.yml exec -T nginx-proxy curl -f http://localhost/health > /dev/null 2>&1; then
              echo "[$(date +'%Y-%m-%d %H:%M:%S')] ✅ Nginx healthy" | tee -a "$LOG_FILE"
            else
              echo "[$(date +'%Y-%m-%d %H:%M:%S')] ❌ Nginx health check failed" | tee -a "$LOG_FILE"
              exit 1
            fi
            
            # Save last backup info
            echo "$BACKUP_NAME" > "${DEPLOYMENT_DIR}/last-backup.txt"
            
            echo "[$(date +'%Y-%m-%d %H:%M:%S')] ✅ Deployment successful!" | tee -a "$LOG_FILE"

      - name: Rollback on failure
        if: failure()
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            DEPLOYMENT_DIR="/home/deploy/production/coachify"
            LOG_FILE="${DEPLOYMENT_DIR}/deploy.log"
            
            echo "[$(date +'%Y-%m-%d %H:%M:%S')] ⚠️ Deployment failed, rolling back..." | tee -a "$LOG_FILE"
            
            cd "$DEPLOYMENT_DIR"
            
            # Get last backup
            LAST_BACKUP=$(cat last-backup.txt 2>/dev/null || echo "")
            
            if [ -z "$LAST_BACKUP" ]; then
              echo "[$(date +'%Y-%m-%d %H:%M:%S')] ❌ No backup found, performing graceful restart" | tee -a "$LOG_FILE"
              docker compose -f docker-compose.prod.yml restart
            else
              echo "[$(date +'%Y-%m-%d %H:%M:%S')] Restoring from backup: $LAST_BACKUP" | tee -a "$LOG_FILE"
              docker compose -f docker-compose.prod.yml restart
            fi

      - name: Slack Notification
        if: always()
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "Deployment to VPS",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Deployment Status*: ${{ job.status == 'success' && '✅ Success' || '❌ Failed' }}\n*Service*: ${{ github.event.client_payload.service || 'Manual' }}\n*Commit*: <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>"
                  }
                }
              ]
            }
