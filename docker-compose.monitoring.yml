# docker-compose.monitoring.yml
# Monitoring Stack for Coachify Platform
# Includes Prometheus, Grafana, and AlertManager
#
# Deploy alongside prod stack:
# docker compose -f docker-compose.prod.yml -f docker-compose.monitoring.yml up -d
#
# Or standalone (network must already exist from prod stack):
# docker compose -f docker-compose.monitoring.yml up -d

services:
  # ===========================================
  # Prometheus - Time-series metrics database
  # ===========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: coachify-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.min-block-duration=2h'   # flush to disk sooner
      - '--storage.tsdb.max-block-duration=2h'   # keep blocks small
      - '--query.max-concurrency=4'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - coachify_net
    environment:
      - TZ=UTC
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ===========================================
  # Grafana - Visualization & dashboards
  # ===========================================
  grafana:
    image: grafana/grafana:latest
    container_name: coachify-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
      - GF_SECURITY_COOKIE_SECURE=false
      - GF_SECURITY_COOKIE_SAMESITE=lax
      # Prometheus datasource auto-provisioning
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    networks:
      - coachify_net
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # ===========================================
  # MongoDB Exporter - DB metrics → Prometheus
  # Exposes per-operation latency histograms, connection pool,
  # WiredTiger cache, replication lag, and collection stats.
  # Uses adminUser (root) for full metric access.
  # ===========================================
  mongodb-exporter:
    image: percona/mongodb_exporter:0.40.0
    container_name: coachify-mongodb-exporter
    restart: unless-stopped
    command:
      - '--mongodb.uri=mongodb://adminUser:SportStride2026!@172.18.0.1:27017/?authSource=admin'
      - '--collector.diagnosticdata'
      - '--collector.replicasetstatus'
      - '--collector.dbstats'
      - '--collector.dbstatsfreestorage'
      - '--collector.topmetrics'
      - '--collector.indexstats'
      - '--collector.collstats'
      - '--mongodb.collstats-colls=COACHIFY.invitations,COACHIFY.account,COACHIFY.conversation,COACHIFY.chat,users.users,users.coaches,users.coach_clients,workout-management.workouts,workout-management.exercises,workout-management.programs,workout-management.tasks,workout-management.metrics'
      - '--web.listen-address=:9216'
      - '--web.telemetry-path=/metrics'
      - '--log.level=warn'
    ports:
      - "9216:9216"
    networks:
      - coachify_net
    environment:
      - TZ=UTC
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:9216/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M

  # ===========================================
  # AlertManager - Alert routing & management
  # ===========================================
  alertmanager:
    image: prom/alertmanager:latest
    container_name: coachify-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - coachify_net
    environment:
      - TZ=UTC
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  alertmanager_data:
    driver: local

networks:
  coachify_net:
    # This is the exact network name created by your prod compose
    # Confirmed via: docker network ls | grep coachify -> coachify_coachify_net
    name: coachify_coachify_net
    external: true