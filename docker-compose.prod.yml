#version: '3.9'

# Production Docker Compose - Uses pre-built images from GHCR
# NO local builds; only pulls from registry
# Deploy: docker compose -f docker-compose.prod.yml --env-file .env.production up -d

networks:
  coachify_net:
    driver: bridge
    driver_opts:
      "com.docker.network.driver.mtu": "1500"

volumes:
  nginx_logs:
    driver: local

services:
  # ===========================================
  # Reverse Proxy & Load Balancer
  # ===========================================
  nginx-proxy:
    image: nginx:1.25-alpine
    container_name: coachify-nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl
      - nginx_logs:/var/log/nginx
      - /etc/letsencrypt:/etc/letsencrypt:ro
    environment:
      - TZ=UTC
    networks:
      - coachify_net
    depends_on:
      - frontend
      - identifier-api
      - notification-api
      - account-api
      - chat-api
      - content-api
      - invitation-api
      - payments-api
      - workout-api
      - tracker-api
      - statistics-api
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=nginx-proxy,env=production"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ===========================================
  # Core Microservices - Go APIs (Registry Images)
  # ===========================================

  identifier-api:
    image: ghcr.io/sport-stride/coachify-identifier-api:${IDENTIFIER_API_VERSION:-latest}
    container_name: coachify-identifier-api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - PORT=8080
      - MONGODB_URI=${MONGODB_URI}
      - ENVIRONMENT=production
      - LOG_LEVEL=info
    networks:
      - coachify_net
    pull_policy: always
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
        labels: "service=identifier-api,env=production"
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  notification-api:
    image: ghcr.io/sport-stride/coachify-notification-api:${NOTIFICATION_API_VERSION:-latest}
    container_name: coachify-notification-api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - PORT=8081
      - ENVIRONMENT=production
      - LOG_LEVEL=info
    networks:
      - coachify_net
    pull_policy: always
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
        labels: "service=notification-api,env=production"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 192M
        reservations:
          cpus: '0.25'
          memory: 96M

  account-api:
    image: ghcr.io/sport-stride/coachify-account-api:${ACCOUNT_API_VERSION:-latest}
    container_name: coachify-account-api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - PORT=8082
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - IDENTIFIER_API_URL=http://identifier-api:8080
      - NOTIFICATION_API_URL=http://notification-api:8081
      - INVITATION_API_URL=http://invitation-api:8085
      - PAYMENT_API_URL=http://payments-api:8086
    networks:
      - coachify_net
    pull_policy: always
    depends_on:
      - identifier-api
      - notification-api
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
        labels: "service=account-api,env=production"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  chat-api:
    image: ghcr.io/sport-stride/coachify-chat-api:${CHAT_API_VERSION:-latest}
    container_name: coachify-chat-api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - PORT=8083
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - ACCOUNT_API_URL=http://account-api:8082
    networks:
      - coachify_net
    pull_policy: always
    depends_on:
      - account-api
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
        labels: "service=chat-api,env=production"
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  content-api:
    image: ghcr.io/sport-stride/coachify-content-api:${CONTENT_API_VERSION:-latest}
    container_name: coachify-content-api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - PORT=8084
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - IDENTIFIER_API_URL=http://identifier-api:8080
      - NOTIFICATION_API_URL=http://notification-api:8081
      - ACCOUNT_API_URL=http://account-api:8082
    networks:
      - coachify_net
    pull_policy: always
    depends_on:
      - identifier-api
      - notification-api
      - account-api
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
        labels: "service=content-api,env=production"
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  invitation-api:
    image: ghcr.io/sport-stride/coachify-invitation-api:${INVITATION_API_VERSION:-latest}
    container_name: coachify-invitation-api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - PORT=8085
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - IDENTIFIER_API_URL=http://identifier-api:8080
      - NOTIFICATION_API_URL=http://notification-api:8081
      - ACCOUNT_API_URL=http://account-api:8082
      - CHAT_API_URL=http://chat-api:8083
    networks:
      - coachify_net
    pull_policy: always
    depends_on:
      - identifier-api
      - notification-api
      - account-api
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
        labels: "service=invitation-api,env=production"
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  payments-api:
    image: ghcr.io/sport-stride/coachify-payments-api:${PAYMENTS_API_VERSION:-latest}
    container_name: coachify-payments-api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - PORT=8086
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - ACCOUNT_API_URL=http://account-api:8082
    networks:
      - coachify_net
    pull_policy: always
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
        labels: "service=payments-api,env=production"
    deploy:
      resources:
        limits:
          cpus: '1.25'
          memory: 768M
        reservations:
          cpus: '0.75'
          memory: 384M

  workout-api:
    image: ghcr.io/sport-stride/coachify-workout-api:${WORKOUT_API_VERSION:-latest}
    container_name: coachify-workout-api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - PORT=8087
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - IDENTIFIER_API_URL=http://identifier-api:8080
    networks:
      - coachify_net
    pull_policy: always
    depends_on:
      - identifier-api
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
        labels: "service=workout-api,env=production"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  tracker-api:
    image: ghcr.io/sport-stride/coachify-tracker-api:${TRACKER_API_VERSION:-latest}
    container_name: coachify-tracker-api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - PORT=8088
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - IDENTIFIER_API_URL=http://identifier-api:8080
      - WORKOUT_MANAGEMENT_URL=http://workout-api:8087
      - ACCOUNT_API_URL=http://account-api:8082
    networks:
      - coachify_net
    pull_policy: always
    depends_on:
      - identifier-api
      - workout-api
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
        labels: "service=tracker-api,env=production"
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  statistics-api:
    image: ghcr.io/sport-stride/coachify-statistics-api:${STATISTICS_API_VERSION:-latest}
    container_name: coachify-statistics-api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - PORT=8089
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - IDENTIFIER_API_URL=http://identifier-api:8080
      - WORKOUT_MANAGEMENT_URL=http://workout-api:8087
    networks:
      - coachify_net
    pull_policy: always
    depends_on:
      - identifier-api
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
        labels: "service=statistics-api,env=production"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # ===========================================
  # Frontend Application
  # ===========================================

  frontend:
    image: ghcr.io/sport-stride/coachify-frontend:${FRONTEND_VERSION:-latest}
    container_name: coachify-frontend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - .env.production
      - NODE_ENV=production
      - NEXT_PUBLIC_USE_PROXY=true
      # Auth configuration
      # - NEXTAUTH_URL=${NEXTAUTH_URL}
      # - AUTH_SECRET=${AUTH_SECRET}
      # - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      # - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      
      # # Internal backend service URLs (for server-side proxy)
      - ACCOUNT_API_URL=http://account-api:8082
      - CHAT_API_BASE_URL=http://chat-api:8083
      - WORKOUT_API_URL=http://workout-api:8087
      - INVITATION_API_URL=http://invitation-api:8085
      - STATISTICS_API_URL=http://statistics-api:8089
      - TRACKER_API_URL=http://tracker-api:8088
      - CONTENT_API_URL=http://content-api:8084
      - PAYMENT_API_URL=http://payments-api:8086
      
      # # Client-side API base URLs (these point to external domain)
      # - NEXT_PUBLIC_ACCOUNT_API_BASE_URL=${NEXT_PUBLIC_ACCOUNT_API_BASE_URL}
      # - NEXT_PUBLIC_CHAT_API_BASE_URL=${NEXT_PUBLIC_CHAT_API_BASE_URL}
      # - NEXT_PUBLIC_WORKOUT_API_BASE_URL=${NEXT_PUBLIC_WORKOUT_API_BASE_URL}
      # - NEXT_PUBLIC_PAYMENT_API_BASE_URL=${NEXT_PUBLIC_PAYMENT_API_BASE_URL}
      # - NEXT_PUBLIC_INVITATION_API_BASE_URL=${NEXT_PUBLIC_INVITATION_API_BASE_URL}
      # - NEXT_PUBLIC_TRACKER_API_BASE_URL=${NEXT_PUBLIC_TRACKER_API_BASE_URL}
      # - NEXT_PUBLIC_STATISTICS_API_BASE_URL=${NEXT_PUBLIC_STATISTICS_API_BASE_URL}
      # - NEXT_PUBLIC_BLOG_API_BASE_URL=${NEXT_PUBLIC_BLOG_API_BASE_URL}
      
      # # Other services
      # - NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME}
      # - NEXT_PUBLIC_CLOUDINARY_API_KEY=${NEXT_PUBLIC_CLOUDINARY_API_KEY}
      # - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      # - NEXT_PUBLIC_ABLY_KEY=${NEXT_PUBLIC_ABLY_KEY}
    networks:
      - coachify_net
    pull_policy: always
    depends_on:
      - identifier-api
      - notification-api
      - account-api
      - chat-api
      - content-api
      - invitation-api
      - payments-api
      - workout-api
      - tracker-api
      - statistics-api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/auth/session"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
        labels: "service=frontend,env=production"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G