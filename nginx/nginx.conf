    #     location / {
    #         limit_req zone=general burst=30 nodelay;
    #         proxy_pass http://frontend;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto https;
    #         proxy_intercept_errors on;
    #         error_page 502 503 504 /50x.html;
    #     }
    #
    #     # Copy API location blocks from the HTTP server, ensure X-Forwarded-Proto is set to https
    #
    #     location /health {
    #         access_log off;
    #         return 200 "OK\n";
    #         add_header Content-Type text/plain;
    #     }
    # }

    # ==========================================
    # HTTP to HTTPS Redirect (Production)
    # ==========================================
    # Uncomment together with the HTTPS server block above.
    # server {
    #     listen 80 default_server;
    #     listen [::]:80 default_server;
    #     server_name yourdomain.com www.yourdomain.com;
    #
    #     # Allow Let's Encrypt validation
    #     location /.well-known/acme-challenge/ {
    #         root /var/www/certbot;
    #     }
    #
    #     location / {
    #         return 301 https://$host$request_uri;
    #     }
    # }

    # ==========================================
    # HTTP/2 Push Configuration (Optional)
    # ==========================================
    # http2_push_preload on;

    include /etc/nginx/conf.d/*.conf;
}
